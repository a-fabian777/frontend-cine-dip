server {
   listen 80;
   server_name _;
   root /usr/share/nginx/html;
   index index.html;

   # Archivos con hash en el nombre: cache de 1 año
   location /assets/ {
       expires 1y;
       add_header Cache-Control "public, immutable";
       try_files $uri =404;
   }

   # index.html nunca se cachea para que los despliegues se vean al instante
   location = /index.html {
       add_header Cache-Control "no-cache";
   }

   # SPA: cualquier ruta de React Router cae en index.html
   location / {
       try_files $uri $uri/ /index.html;
   }
}